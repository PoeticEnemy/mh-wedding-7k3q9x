<style>
:root{--bg:#e9dfcf;--bar:#5a0d14;--bar-fg:#f6ecd7;--bubble:#fffaf0;--ink:#3b1a1a;--muted:#8a6f5a;--gold:#c9a24a;--scrim:rgba(20,8,8,.88);color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;background:
 radial-gradient(circle at 20% 15%,rgba(201,162,74,.18),transparent 40%),
 radial-gradient(circle at 85% 80%,rgba(90,13,20,.10),transparent 45%);pointer-events:none}
.app{position:relative;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.bar{background:var(--bar);color:var(--bar-fg);padding:12px 16px;display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--bar);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.bar b{display:block;font-size:16px;letter-spacing:.2px}
.bar span{font-size:12px;opacity:.75}
.chat{flex:1;min-height:0;padding:18px 16px;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;overflow:auto}
.day{align-self:center;background:rgba(255,250,240,.8);color:var(--muted);font-size:12px;padding:4px 12px;border-radius:10px}
.bubble{align-self:flex-start;background:var(--bubble);border-radius:4px 14px 14px 14px;padding:5px 5px 6px;width:min(72%,290px);box-shadow:0 1px 2px rgba(60,30,10,.25);border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:block;transition:transform .15s}
.bubble:active{transform:scale(.98)}
.thumb{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 70%;border-radius:10px}
.meta{display:flex;justify-content:space-between;align-items:center;padding:5px 6px 0;font-size:12px;color:var(--muted)}
.meta i{font-style:normal;color:var(--bar);font-weight:700}
.tip{align-self:flex-start;color:var(--muted);font-size:13px;padding:2px 4px}
.tip.pulse{animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{opacity:.4}}

.ov{position:fixed;inset:0;z-index:10;background:var(--scrim);display:none;touch-action:pan-y}
.ov.on{display:block}
.ov.fade{animation:fi .35s ease both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.stage{position:absolute;left:50%;top:50%;translate:-50% -50%;height:min(calc(100dvh - 96px),calc((100vw - 32px)*16/9));aspect-ratio:9/16;max-width:calc(100vw - 32px);will-change:transform}
.card{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55);transition:transform .6s cubic-bezier(.22,.9,.3,1),opacity .5s ease;user-select:none;-webkit-user-drag:none;pointer-events:none;background:#f3e6c9}
.card.past{transform:translateX(-120%) rotate(-9deg);opacity:0}
.card.cur{transform:none;opacity:1}
.card.next{transform:translateY(8%) scale(.94);opacity:0}
.hud{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;color:#f6ecd7;font-size:14px;pointer-events:none}
.dots{display:flex;gap:7px}
.dots u{width:7px;height:7px;border-radius:50%;background:rgba(246,236,215,.35);transition:.3s}
.dots u.on{background:var(--gold);transform:scale(1.35)}
.x{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;line-height:1;cursor:pointer}
@media (prefers-reduced-motion:reduce){.card{transition:opacity .3s}.card.past,.card.next{transform:none}.ov.fade{animation:none}}
</style>

const ORDER=['env','walima'];
const LABEL=['Tap to open the invitation','Next: Mehndi','Next: Barat','Next: Walima','Tap to close',''];
const HINT=['Tap to open','Tap for the Walima card','Tap to close'];
const $=id=>document.getElementById(id);
const ov=$('ov'),stage=$('stage'),bubble=$('bubble'),dots=$('dots'),hint=$('hint');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
$('thumb').src=IMG.env;
const cards=ORDER.map(k=>{const i=new Image();i.src=IMG[k];i.className='card next';i.alt='';i.draggable=false;stage.appendChild(i);return i});
ORDER.forEach(()=>dots.appendChild(document.createElement('u')));
let idx=-1,busy=false;
function paint(){
  cards.forEach((c,i)=>{c.className='card '+(i<idx?'past':i===idx?'cur':'next')});
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===idx));
  hint.textContent=HINT[idx+1]||'';
}
function flip(toBubble){
  const b=bubble.getBoundingClientRect(),s=stage.getBoundingClientRect();
  const sc=Math.min(b.width/s.width,b.height/s.height);
  const dx=(b.left+b.width/2)-(s.left+s.width/2),dy=(b.top+b.height/2)-(s.top+s.height/2);
  const small=`translate(${dx}px,${dy}px) scale(${sc})`;
  const frames=toBubble?[{transform:'none',opacity:1},{transform:small,opacity:0}]:[{transform:small,opacity:.2},{transform:'none',opacity:1}];
  return stage.animate(frames,{duration:reduce?150:520,easing:'cubic-bezier(.22,.9,.3,1)',fill:'both'}).finished;
}
async function open(){
  if(busy)return;busy=true;
  ov.classList.add('on','fade');idx=0;paint();
  await flip(false);busy=false;
}
async function close(){
  if(busy)return;busy=true;
  ov.style.background='transparent';
  await flip(true);
  ov.classList.remove('on','fade');ov.style.background='';
  stage.getAnimations().forEach(a=>a.cancel());
  idx=-1;busy=false;
  $('tip').textContent='Tap the card to open it again';
}
function next(){
  if(busy)return;
  if(idx<0)return open();
  if(idx>=ORDER.length-1)return close();
  idx++;paint();
}
function back(){if(busy||idx<=0)return;idx--;paint()}
bubble.addEventListener('click',open);
ov.addEventListener('click',e=>{if(e.target.id==='x')return close();next()});
let sx=null;
ov.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
ov.addEventListener('touchend',e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;sx=null;if(d>70){back();ov._sw=1}},{passive:true});
ov.addEventListener('click',e=>{},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&idx>=0)close();
  else if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){if(idx>=0){e.preventDefault();next()}}
  else if(e.key==='ArrowLeft')back();
});
</script>
